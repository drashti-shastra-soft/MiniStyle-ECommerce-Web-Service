<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome to Ministyle</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <div style="max-width: 600px; margin: auto; background-color: #ffffff; padding: 20px; border-radius: 8px;">


        <!-- Header -->
        <div style="background-color: #0078D7; color: white; padding: 10px 20px; border-radius: 8px 8px 0 0;">
            <h2 style="margin: 0;">Welcome, {{FirstName}}!</h2>
        </div>

        <!-- Credentials Box -->
        <div style="background-color: #f0f0f0; padding: 10px; border-radius: 6px; font-family: monospace;">
            <p><strong>Username:</strong> {{EmailAddress}}</p>
            <p><strong>Password:</strong> {{Password}}</p>
        </div>

        <p style="margin-top: 20px;">🔐 For security, please change your password after your first login.</p>
        <p>If you have any questions or need assistance, feel free to reach out to our support team.</p>

    </div>
</body>
</html>
